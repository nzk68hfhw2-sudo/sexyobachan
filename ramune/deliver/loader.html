var i=0,done=false,tried=[];

if(i>=U.length){show('game.js を読み込めませんでした','通信状態を確認して、もう一度ひらいてください。');return;}
var u=U[i++];tried.push(u);
var s=document.createElement('script');s.src=u;s.async=true;
s.onload=function(){var t0=Date.now();(function chk(){
if(window.__rmReady||document.getElementById('rm-fatal')){done=true;var l=document.getElementById('rml');if(l)l.style.display='none';return;}

setTimeout(chk,400);})();};
s.onerror=function(){if(s.parentNode)s.parentNode.removeChild(s);next();};

}
