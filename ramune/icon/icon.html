<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@900&family=DotGothic16&display=block">
<style>
html,body{margin:0;background:transparent}
#icon{position:relative;width:1024px;height:1024px;overflow:hidden;font-family:"Zen Maru Gothic",sans-serif}
#icon.round{border-radius:230px}
.bg{position:absolute;inset:0;background:
  radial-gradient(circle at 50% 40%,rgba(255,95,168,.55) 0%,rgba(255,95,168,0) 42%),
  radial-gradient(circle at 18% 92%,rgba(125,249,255,.35) 0%,rgba(125,249,255,0) 40%),
  radial-gradient(circle at 88% 12%,rgba(180,107,255,.55) 0%,rgba(180,107,255,0) 45%),
  linear-gradient(160deg,#2a0f5c 0%,#160830 55%,#0b0420 100%)}
svg{position:absolute;inset:0}
.tag{position:absolute;left:50%;top:70px;transform:translateX(-50%) rotate(-6deg);background:#ff2d55;color:#fff;font-size:96px;line-height:1;padding:18px 44px 26px;border-radius:30px;
  box-shadow:0 12px 0 #8a0f25,0 0 60px rgba(255,45,85,.7);letter-spacing:.02em;white-space:nowrap}
.tag:before{content:"";position:absolute;inset:10px;border:5px solid rgba(255,255,255,.35);border-radius:22px}
.main{position:absolute;left:0;right:0;top:600px;text-align:center;font-size:268px;line-height:1;color:#fff;letter-spacing:-.02em;
  text-shadow:0 0 2px #000,10px 10px 0 #ff5fa8,20px 20px 0 #6a3cff,0 0 70px rgba(125,249,255,.55)}
.sub{position:absolute;left:50%;top:880px;transform:translateX(-50%);white-space:nowrap;font-size:88px;line-height:1;color:#fff;padding:14px 40px 20px;border-radius:999px;
  background:rgba(10,4,26,.85);border:5px solid #7df9ff;box-shadow:0 0 40px rgba(125,249,255,.6)}
.notext .main,.notext .sub,.notext .tag{display:none}
.notext svg{transform:translate(0,74px) scale(1.22);transform-origin:512px 438px}
.notext .bg{background:radial-gradient(circle at 50% 50%,rgba(255,95,168,.55) 0%,rgba(255,95,168,0) 48%),radial-gradient(circle at 18% 92%,rgba(125,249,255,.35) 0%,rgba(125,249,255,0) 40%),radial-gradient(circle at 88% 12%,rgba(180,107,255,.55) 0%,rgba(180,107,255,0) 45%),linear-gradient(160deg,#2a0f5c 0%,#160830 55%,#0b0420 100%)}
</style></head><body>
<div id="icon" class="round">
  <div class="bg"></div>
  <svg width="1024" height="1024" viewBox="0 0 1024 1024">
    <defs>
      <radialGradient id="pill" cx="38%" cy="32%" r="75%">
        <stop offset="0" stop-color="#ffffff"/><stop offset=".22" stop-color="#bff8ff"/><stop offset=".55" stop-color="#7df9ff"/><stop offset=".85" stop-color="#c77dff"/><stop offset="1" stop-color="#7a2bd6"/>
      </radialGradient>
      <radialGradient id="pillEdge" cx="50%" cy="50%" r="50%"><stop offset=".86" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#2a0f5c" stop-opacity=".55"/></radialGradient>
      <linearGradient id="heart" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffd1e8"/><stop offset=".5" stop-color="#ff5fa8"/><stop offset="1" stop-color="#c2185b"/></linearGradient>
      <linearGradient id="star" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff7c2"/><stop offset=".5" stop-color="#ffe14d"/><stop offset="1" stop-color="#ff9f1c"/></linearGradient>
      <linearGradient id="cap" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ffffff"/><stop offset=".5" stop-color="#ffffff"/><stop offset=".5" stop-color="#ff3355"/><stop offset="1" stop-color="#ff3355"/></linearGradient>
      <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="22" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
      <filter id="soft"><feGaussianBlur stdDeviation="3"/></filter>
      <pattern id="hz" width="80" height="80" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="40" height="80" fill="#ffd60a"/><rect x="40" width="40" height="80" fill="#151515"/></pattern>
    </defs>
    <!-- stars -->
    <g fill="#fff" opacity=".85">
      <circle cx="120" cy="250" r="4"/><circle cx="900" cy="300" r="5"/><circle cx="830" cy="560" r="3"/><circle cx="180" cy="520" r="3"/><circle cx="960" cy="720" r="4"/><circle cx="70" cy="760" r="3"/><circle cx="300" cy="190" r="3"/><circle cx="760" cy="220" r="3"/>
      <path d="M150 380 l8 22 22 8 -22 8 -8 22 -8 -22 -22 -8 22 -8z"/><path d="M880 440 l7 18 18 7 -18 7 -7 18 -7 -18 -18 -7 18 -7z"/>
    </g>
    <!-- caution tape behind the pill -->
    <g transform="rotate(-18 512 420)">
      <rect x="-80" y="372" width="1184" height="96" fill="url(#hz)"/>
      <rect x="-80" y="372" width="1184" height="8" fill="#151515" opacity=".6"/><rect x="-80" y="460" width="1184" height="8" fill="#151515" opacity=".6"/>
    </g>
    <!-- side candies -->
    <g filter="url(#glow)">
      <path transform="translate(210 520) rotate(-18) scale(1.15)" d="M0 -58 L16 -18 58 -16 25 10 36 52 0 28 -36 52 -25 10 -58 -16 -16 -18Z" fill="url(#star)" stroke="#fff" stroke-width="5" stroke-linejoin="round"/>
      <path transform="translate(822 520) rotate(14) scale(1.05)" d="M0 30 C-60 -10 -70 -60 -35 -70 C-15 -76 0 -60 0 -45 C0 -60 15 -76 35 -70 C70 -60 60 -10 0 30Z" transform-origin="0 0" fill="url(#heart)" stroke="#fff" stroke-width="5"/>
      <g transform="translate(250 300) rotate(-35)"><rect x="-62" y="-26" width="124" height="52" rx="26" fill="url(#cap)" stroke="#fff" stroke-width="5"/></g>
    </g>
    <!-- main tablet -->
    <g filter="url(#glow)">
      <ellipse cx="512" cy="455" rx="215" ry="205" fill="#5a1fa8"/>
      <ellipse cx="512" cy="438" rx="215" ry="205" fill="url(#pill)"/>
      <ellipse cx="512" cy="438" rx="215" ry="205" fill="url(#pillEdge)"/>
      <!-- score line + imprint -->
      <ellipse cx="512" cy="438" rx="165" ry="155" fill="none" stroke="#ffffff" stroke-opacity=".35" stroke-width="6"/>
      <!-- warning triangle imprint -->
      <path d="M512 325 L612 505 L412 505 Z" fill="#ff2d55" stroke="#fff" stroke-width="12" stroke-linejoin="round"/>
      <rect x="500" y="375" width="24" height="80" rx="12" fill="#fff"/><circle cx="512" cy="482" r="14" fill="#fff"/>
      <!-- gloss -->
      <ellipse cx="430" cy="320" rx="95" ry="42" transform="rotate(-28 430 320)" fill="#fff" opacity=".75" filter="url(#soft)"/>
      <circle cx="610" cy="560" r="10" fill="#fff" opacity=".6"/>
    </g>
    <!-- bubbles (ramune soda) -->
    <g fill="none" stroke="#bff8ff" stroke-width="4" opacity=".7">
      <circle cx="770" cy="380" r="16"/><circle cx="800" cy="330" r="9"/><circle cx="740" cy="300" r="12"/><circle cx="270" cy="660" r="12"/><circle cx="300" cy="610" r="7"/>
    </g>
  </svg>
  <div class="tag">キケンな</div>
  <div class="main">ラムネ</div>
  <div class="sub">シミュレーター</div>
</div>
</body></html>
