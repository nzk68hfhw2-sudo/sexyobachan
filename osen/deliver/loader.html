<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>精神汚染オンライン</title>
<style>
html,body{margin:0;padding:0;height:100%;background:#1a0a5e;overflow:hidden}
#osl{position:fixed;left:16px;right:16px;top:45%;color:#ff0;font:bold 16px sans-serif;text-align:center}
#ose{display:none;position:fixed;left:16px;right:16px;top:calc(env(safe-area-inset-top,0px) + 70px);background:#fffbe0;color:#300;border:4px solid #f0f;padding:12px;font:14px/1.6 sans-serif;white-space:pre-wrap;word-break:break-all;z-index:2147483647}
</style>
</head>
<body>
<div id="osl">よみこみ中でございます…</div>
<div id="ose"></div>
<script>
(function(){
var BASE='https://stupendous-moxie-15d900.netlify.app/';
var URL_JS=BASE+'game.js?t='+Date.now();
var done=false;
function show(t,d){
var e=document.getElementById('ose');
e.style.display='block';
e.textContent='【読み込みエラー】'+t+'\n'+(d||'')+'\n\nURL: '+URL_JS+'\nオンライン: '+(navigator.onLine?'はい':'いいえ')+'\nUA: '+navigator.userAgent;
var l=document.getElementById('osl');if(l)l.style.display='none';
}
window.addEventListener('error',function(ev){
if(done)return;
if(document.getElementById('os-fatal'))return;
show('スクリプトの実行中にエラーが起きました',(ev.message||'')+' '+(ev.filename||'')+':'+(ev.lineno||''));
});
var s=document.createElement('script');
s.src=URL_JS;
s.async=true;
s.onload=function(){
var l=document.getElementById('osl');if(l)l.style.display='none';
var t0=Date.now();
(function chk(){
if(window.__osReady||document.getElementById('os-fatal')){done=true;return;}
if(Date.now()-t0>60000){show('起動がタイムアウトしました','game.js は読み込めましたが起動が終わりません。three.js(cdnjs) の読み込みが止められていないか確認してください。');return;}
setTimeout(chk,500);
})();
};
s.onerror=function(){
show('game.js を読み込めませんでした','NetlifyのURLが正しいか、サイトが公開されているか、通信状態を確認してください。');
};
document.body.appendChild(s);
})();
</script>
</body>
</html>
